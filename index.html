<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חוברת מתכונים מתוקים - נטע ליבנה</title>
  <meta name="description" content="הורדי חינם את חוברת המתכונים המתוקים הבריאים של נטע ליבנה, דיאטנית קלינית.">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; }

    /* ── DESKTOP: 50/50 split ── */
    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      height: 100vh;
      width: 100vw;
      font-family: 'Assistant', sans-serif;
      direction: rtl;
    }

    /* Right panel — content */
    .panel-content {
      background: #FBF9F6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px 52px;
      overflow-y: auto;
      height: 100vh;
    }

    /* Left panel — image */
    .panel-image {
      background-image: url('https://netacooks.co.il/wp-content/uploads/2026/06/kadourei-dubai.jpg');
      background-size: cover;
      background-position: center;
      height: 100vh;
    }

    /* ── TEXT ── */
    .pre { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #A8294E; margin-bottom: 18px; }
    h1 { font-size: 36px; font-weight: 800; line-height: 1.15; color: #1A1A1A; letter-spacing: -.02em; margin-bottom: 18px; }
    .sub { font-size: 15px; font-weight: 300; line-height: 1.8; color: #5A5A5A; margin-bottom: 32px; }
    .form-lbl { font-size: 12px; font-weight: 600; color: #999; margin-bottom: 10px; }

    /* ── FORM ── */
    .field {
      width: 100%;
      display: block;
      padding: 14px 16px;
      font-size: 15px;
      font-family: 'Assistant', sans-serif;
      background: #fff;
      border: 1.5px solid #D8D2CA;
      border-radius: 4px;
      color: #1A1A1A;
      margin-bottom: 10px;
      direction: rtl;
      text-align: right;
      -webkit-appearance: none;
      transition: border-color .2s;
    }
    .field:focus { outline: none; border-color: #A8294E; box-shadow: 0 0 0 3px rgba(168,41,78,.08); }
    .field::placeholder { color: #C0B8B0; }

    .btn {
      width: 100%;
      display: block;
      padding: 15px;
      background: #A8294E;
      color: #fff;
      font-family: 'Assistant', sans-serif;
      font-size: 17px;
      font-weight: 700;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background .2s;
      margin-top: 4px;
    }
    .btn:hover { background: #8B1F3F; }

    .fine { font-size: 11px; color: #C0B8B0; text-align: center; margin-top: 14px; }

    /* ── MOBILE ── */
    @media (max-width: 700px) {
      html, body { overflow: auto; height: auto; }
      .page { grid-template-columns: 1fr; grid-template-rows: 55vw auto; height: auto; }
      .panel-image { height: 55vw; order: -1; }
      .panel-content { height: auto; padding: 36px 24px 52px; overflow: visible; }
      h1 { font-size: 26px; }
    }
  </style>
</head>
<body>
<div class="page">

  <div class="panel-content">
    <p class="pre">ספר דיגיטלי במתנה לחברות הבלוג:</p>
    <h1>בלי לספור קלוריות<br>ובלי רגשות אשם</h1>
    <p class="sub">הורדי עכשיו את חוברת המתכונים המתוקים והבריאים של הדיאטנית הקלינית נטע ליבנה, שיעזרו לך לרדת במשקל בלי לוותר על הקפה של אחה&quot;צ.</p>
    <p class="form-lbl">הזיני פרטים ואשלח לך מיידית:</p>
    <form id="signup" action="RAVMESSER_ACTION_URL" method="post" onsubmit="return handleSubmit(event)">
      <input class="field" type="text" name="name" placeholder="השם שלך כאן" required>
      <input class="field" type="email" name="email" placeholder="המייל הטוב ביותר שלך" required>
      <button class="btn" type="submit">שלחי לי את החוברת למייל 💜</button>
    </form>
    <p class="fine">ללא ספאם. ביטול בכל עת. הפרטים שלך בטוחים.</p>
  </div>

  <div class="panel-image"></div>

</div>

<script>
function handleSubmit(e) {
  e.preventDefault();
  var name = document.querySelector('[name="name"]').value;
  var email = document.querySelector('[name="email"]').value;
  // POST to Rav Messer via fetch
  fetch('RAVMESSER_ACTION_URL', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'name=' + encodeURIComponent(name) + '&email=' + encodeURIComponent(email)
  }).then(function() {
    document.getElementById('signup').innerHTML = '<div style="text-align:center;padding:24px 0"><div style="font-size:40px;margin-bottom:12px">🎉</div><div style="font-size:20px;font-weight:700;color:#A8294E;margin-bottom:8px">נהדר! שלחתי לך את החוברת</div><div style="font-size:14px;color:#888">בדקי את תיבת הדואר שלך ❤️</div></div>';
  }).catch(function() {
    window.location.href = 'https://netacooks.co.il/%D7%90%D7%99%D7%96%D7%94-%D7%9B%D7%99%D7%A3-%D7%A9%D7%91%D7%97%D7%A8%D7%AA-%D7%9C%D7%94%D7%95%D7%A8%D7%99%D7%93-%D7%90%D7%AA-%D7%A7%D7%95%D7%91%D7%A5-%D7%94%D7%9E%D7%AA%D7%9B%D7%95%D7%A0%D7%99%D7%9D/';
  });
}
</script>
</body>
</html>
