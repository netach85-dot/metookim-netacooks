<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>חוברת מתכונים מתוקים - נטע ליבנה</title>
  <meta name="description" content="הורדי חינם את חוברת המתכונים המתוקים הבריאים של נטע ליבנה, דיאטנית קלינית.">
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; min-height: 100%; background: #FBF9F6; }

    /* ══ DESKTOP ══ */
    .page {
      display: grid;
      grid-template-columns: 1fr 1fr;
      min-height: 100vh;
      font-family: 'Assistant', sans-serif;
      direction: rtl;
    }

    /* RIGHT: content — centered */
    .panel-content {
      background: #FBF9F6;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 72px 52px;
      min-height: 100vh;
    }

    /* LEFT: image — full, not cropped */
    .panel-image {
      background: #f0ece6;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    .panel-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }

    /* ══ TEXT ══ */
    .pre {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #A8294E;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 52px;
      font-weight: 900;
      line-height: 1.1;
      color: #1A1A1A;
      letter-spacing: -0.03em;
      margin-bottom: 22px;
      max-width: 480px;
    }
    .sub {
      font-size: 17px;
      font-weight: 300;
      line-height: 1.85;
      color: #5A5A5A;
      margin-bottom: 36px;
      max-width: 420px;
    }
    .form-lbl {
      font-size: 12px;
      font-weight: 600;
      color: #AAA;
      margin-bottom: 12px;
    }

    /* ══ RAV MESSER FORM OVERRIDE ══ */
    #rm-wrap { width: 100%; max-width: 380px; direction: rtl; }

    /* Hide Rav Messer's own title/image */
    #rm-wrap h1, #rm-wrap h2, #rm-wrap h3,
    #rm-wrap img, #rm-wrap [class*="title"],
    #rm-wrap [class*="header"], #rm-wrap [class*="image"],
    #rm-wrap [class*="logo"], #rm-wrap [class*="banner"] { display: none !important; }

    /* Remove wrapper padding */
    #rm-wrap > div, #rm-wrap form {
      padding: 0 !important; margin: 0 !important;
      background: transparent !important;
      border: none !important; box-shadow: none !important;
      max-width: 100% !important; width: 100% !important;
    }

    /* Input fields */
    #rm-wrap input[type="text"],
    #rm-wrap input[type="email"],
    #rm-wrap input[type="tel"] {
      width: 100% !important; display: block !important;
      padding: 14px 18px !important;
      font-size: 15px !important;
      font-family: 'Assistant', sans-serif !important;
      background: #fff !important;
      border: 1.5px solid #E2DDD8 !important;
      border-radius: 6px !important;
      color: #1A1A1A !important;
      margin-bottom: 10px !important;
      direction: rtl !important; text-align: right !important;
      -webkit-appearance: none !important;
      box-sizing: border-box !important;
    }
    #rm-wrap input[type="text"]:focus,
    #rm-wrap input[type="email"]:focus {
      outline: none !important;
      border-color: #A8294E !important;
      box-shadow: 0 0 0 3px rgba(168,41,78,.07) !important;
    }

    /* Checkbox */
    #rm-wrap input[type="checkbox"] {
      appearance: none !important;
      -webkit-appearance: none !important;
      width: 18px !important; height: 18px !important;
      min-width: 18px !important;
      border: 2px solid #C8C0B8 !important;
      border-radius: 4px !important;
      background: #fff !important;
      cursor: pointer !important;
      transition: background .15s !important;
      position: relative !important;
      flex-shrink: 0 !important;
    }
    #rm-wrap input[type="checkbox"]:checked {
      background: #A8294E !important;
      border-color: #A8294E !important;
    }

    /* Submit button */
    #rm-wrap input[type="submit"],
    #rm-wrap button[type="submit"],
    #rm-wrap button.submit,
    #rm-wrap [class*="submit"] {
      width: 100% !important; display: block !important;
      padding: 16px !important;
      background: #A8294E !important;
      color: #fff !important;
      font-family: 'Assistant', sans-serif !important;
      font-size: 17px !important; font-weight: 700 !important;
      border: none !important; border-radius: 6px !important;
      cursor: pointer !important;
      letter-spacing: 0.02em !important;
      -webkit-appearance: none !important;
      margin-top: 4px !important;
    }
    #rm-wrap input[type="submit"]:hover,
    #rm-wrap button[type="submit"]:hover {
      background: #8B1F3F !important;
    }

    .fine {
      font-size: 11px;
      color: #C8C0B8;
      text-align: center;
      margin-top: 14px;
      max-width: 380px;
    }

    /* ══ MOBILE ══ */
    @media (max-width: 720px) {
      .page {
        grid-template-columns: 1fr;
        min-height: auto;
      }
      /* Image FIRST on mobile */
      .panel-image {
        order: 1;
        min-height: auto;
        height: auto;
      }
      .panel-image img {
        width: 100%;
        height: auto;
        object-fit: contain;
      }
      /* Form SECOND on mobile */
      .panel-content {
        order: 2;
        min-height: auto;
        padding: 40px 24px 52px;
      }
      h1 { font-size: 32px; max-width: 100%; }
      .sub { font-size: 15px; max-width: 100%; }
      form { max-width: 100%; }
      .fine { max-width: 100%; }
    }

    @media (min-width: 721px) and (max-width: 1100px) {
      .panel-content { padding: 60px 36px; }
      h1 { font-size: 40px; }
    }
  </style>
</head>
<body>
<div class="page">

  <!-- RIGHT: Content — centered -->
  <div class="panel-content">
    <p class="pre">חוברת מתכונים מתוקים בריאים במתנה:</p>
    <h1>בלי לספור קלוריות<br>ובלי רגשות אשם</h1>
    <p class="sub">בלי תפריטים ובלי חוקים נוקשים. פשוט מתכונים מתוקים ובריאים שיסגרו לך את הפינה של אחה&quot;צ ויעזרו לך לרדת במשקל.</p>
    <p class="form-lbl">הזיני פרטים ואשלח לך מיידית:</p>
    <div id="rm-wrap">
      <script type='text/javascript' src='//form2.ravpage.co.il/0af7891c8a15481ddeda40b0d84760bc6984899E' charset='UTF-8'></script>
    </div>
    <p class="fine">ללא ספאם. ביטול בכל עת. הפרטים שלך בטוחים.</p>
  </div>

  <!-- LEFT: Image — not cropped -->
  <div class="panel-image">
    <img src="https://netacooks.co.il/wp-content/uploads/2026/06/mockup-hero.jpg" alt="חוברת מתכונים מתוקים">
  </div>

</div>
<script>
function handleSubmit(e) {
  e.preventDefault();
  var name = document.querySelector('[name="name"]').value;
  var email = document.querySelector('[name="email"]').value;
  fetch('RAVMESSER_ACTION_URL', {
    method: 'POST',
    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
    body: 'name=' + encodeURIComponent(name) + '&email=' + encodeURIComponent(email)
  }).then(function() {
    document.getElementById('signup').innerHTML = '<div style="text-align:center;padding:32px 0"><div style="font-size:44px;margin-bottom:14px">🎉</div><div style="font-size:22px;font-weight:700;color:#A8294E;margin-bottom:10px;">נהדר! שלחתי לך את החוברת</div><div style="font-size:14px;color:#999;">בדקי את תיבת הדואר שלך</div></div>';
  }).catch(function() {
    window.location.href = 'https://netacooks.co.il/%D7%90%D7%99%D7%96%D7%94-%D7%9B%D7%99%D7%A3-%D7%A9%D7%91%D7%97%D7%A8%D7%AA-%D7%9C%D7%94%D7%95%D7%A8%D7%99%D7%93-%D7%90%D7%AA-%D7%A7%D7%95%D7%91%D7%A5-%D7%94%D7%9E%D7%AA%D7%9B%D7%95%D7%A0%D7%99%D7%9D/';
  });
}
</script>
</body>
</html>
